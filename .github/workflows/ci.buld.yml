name: Run tests and build

on: [push]    
  
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      name: Install pnpm
      with:
        version: 10
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Test 
      run: pnpm test
      continue-on-error: true

    - name: Build
      run: pnpm build


  docker:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Setup environment variables
        run: |
          
          echo "IMAGE_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
          if [[ $IS_MAIN == 'true' ]]; then
            echo "DOCKER_IMAGE=aisheets/sheets" >> $GITHUB_ENV
            echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          elif [[ $IS_RELEASE == 'true' ]]; then
            echo "DOCKER_IMAGE=aisheets/sheets" >> $GITHUB_ENV
            echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
          else
            echo "DOCKER_IMAGE=aisheets/sheets-dev" >> $GITHUB_ENV
            echo "PLATFORMS=linux/amd64" >> $GITHUB_ENV
          fi
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/stable' }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Push latest image
        if: github.ref == 'refs/heads/stable'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.DOCKER_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          push: true